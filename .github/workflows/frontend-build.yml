name: Frontend Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  frontend-build:
    name: Run Frontend Build
    runs-on: ubuntu-latest

    env:
      NODE_OPTIONS: --max-old-space-size=8192

    defaults:
      run:
        working-directory: Frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Debug - check node and vite versions
        run: |
          node --version
          echo "vite path:"
          node -e "console.log(require.resolve('vite'))"
          echo "vite version:"
          node -e "console.log(require('./node_modules/vite/package.json').version)"

      - name: Build frontend (vite build)
        id: build
        run: |
          node ./node_modules/vite/bin/vite.js build 2>&1 | tee ${{ runner.temp }}/vite-build.log
          exit ${PIPESTATUS[0]}

      - name: Upload vite build log
        if: always() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: vite-build-log-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/vite-build.log

      - name: Check TypeScript (tsc)
        run: 'npx tsc -b --noEmit || echo "WARN: tsc strict-mode errors exist (unused imports). See PHASE_4C1_FRONTEND_BUILD_CI_REPORT.md"'
